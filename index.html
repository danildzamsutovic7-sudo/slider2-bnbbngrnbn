<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="https://picsum.photos/id/1018/800/600" alt="Slide 1"></div>
      <div class="swiper-slide"><img src="https://picsum.photos/id/1015/800/600" alt="Slide 2"></div>
      <div class="swiper-slide"><img src="https://picsum.photos/id/1039/800/600" alt="Slide 3"></div>
      <div class="swiper-slide"><img src="https://picsum.photos/id/1025/800/600" alt="Slide 4"></div>
      <div class="swiper-slide"><img src="https://picsum.photos/id/1069/800/600" alt="Slide 5"></div>
    </div>
    
    <div class="swiper-pagination"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
